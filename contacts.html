   <style>

<body>
     <nav aria-label="Main navigation"></nav><a href="index.html">Home Page</a>   &nbsp;&nbsp;&nbsp; <a href="about.html">About</a>   &nbsp;&nbsp;&nbsp; <a href="menu.html">Menu</a>   &nbsp;&nbsp;&nbsp; <a href="Buildyourbowl.html">Build your bowl</a>   &nbsp;&nbsp;&nbsp; <a href="contacts.html">contacts</a></nav>
    <h1>Get in touch</h1>
    <p>Have a question, want to place an order, or just craving a bowl? We’d love to hear from you!</p>
    <form><label for="name">Name:</label>
     <input type="text" id="name" name="name" required> <br><br>
      <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <br><br> <label for="reason">Reason for Contact:</label>
        <select id="reason" name="reason" required>
            <option value="">Choose one</option>
            <option value="order">Place an Order</option>
            <option value="question">Ask a Question</option>
            <option value="catering">Catering</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other</option><label for="message">Message:</label> </select>
        <br> <label for="message">Message:</label>
<br>

        <textarea id="message" name="message" rows="5" cols="30" required></textarea>

        <br><br>

        <button type="submit">Send Message</button> </select>

    </form>

      
</body>
